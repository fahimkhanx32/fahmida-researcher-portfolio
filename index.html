<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Academic portfolio of Dr. Fahmida Bristy, registered veterinary doctor and graduate of Sher-e-Bangla Agricultural University." />
    <meta name="theme-color" content="#10243B" />
    <title>Dr. Fahmida Bristy — Academic Portfolio</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
